<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Tu Tiên Giới</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; touch-action: none; }
      #game { position: fixed; inset: 0; }
      #auth { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
        background: rgba(8, 10, 16, 0.85); font-family: "Be Vietnam Pro", system-ui, sans-serif; z-index: 10; }
      #auth[hidden], #hud[hidden], #logout[hidden] { display: none; }
      .card { width: 100%; max-width: 360px; padding: 24px; border-radius: 12px; background: #1b2130; color: #e8e4d8; box-sizing: border-box; }
      .card h1 { margin: 0 0 16px; font-size: 22px; text-align: center; }
      .card form { display: flex; flex-direction: column; gap: 12px; }
      .card input { padding: 10px 12px; border-radius: 8px; border: 1px solid #3a4560; background: #10141c; color: inherit; font: inherit; }
      .card button { padding: 10px 12px; border-radius: 8px; border: 0; background: #d6a94b; color: #1b1405; font: inherit; font-weight: 600; cursor: pointer; }
      .card button:disabled { opacity: 0.6; cursor: default; }
      .card button.link { background: none; color: #9db4e0; font-weight: 400; }
      .card .error { margin: 0; min-height: 1.2em; color: #ff8a80; font-size: 14px; }
      .card .note { margin: 0; font-size: 13px; color: #aab3c5; }
      #logout { position: fixed; right: 12px; top: 12px; padding: 6px 12px; border-radius: 8px; border: 0; background: rgba(0, 0, 0, 0.55);
        color: #e8e4d8; font: 14px "Be Vietnam Pro", system-ui, sans-serif; cursor: pointer; }
      #vitals { position: fixed; left: 12px; top: 56px; width: 200px; padding: 6px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.55);
        color: #e8e4d8; font: 12px/1.3 "Be Vietnam Pro", system-ui, sans-serif; pointer-events: none; box-sizing: border-box; }
      #vitals[hidden] { display: none; }
      #vitals-bar { height: 8px; border-radius: 4px; background: #10141c; overflow: hidden; margin-top: 3px; }
      #vitals-fill { height: 100%; width: 100%; background: #e53935; transition: width 0.15s; }
      #char-btn { position: fixed; right: 12px; top: 52px; padding: 6px 12px; border-radius: 8px; border: 0; background: rgba(0, 0, 0, 0.55);
        color: #e8e4d8; font: 14px "Be Vietnam Pro", system-ui, sans-serif; cursor: pointer; }
      #char-btn[hidden], #char-panel[hidden] { display: none; }
      #char-panel { position: fixed; right: 12px; top: 92px; width: min(300px, calc(100vw - 24px)); max-height: calc(100vh - 110px); overflow-y: auto;
        padding: 12px; border-radius: 10px; background: rgba(27, 33, 48, 0.95); color: #e8e4d8; box-sizing: border-box;
        font: 14px/1.4 "Be Vietnam Pro", system-ui, sans-serif; z-index: 5; }
      #char-panel button { border: 0; border-radius: 6px; background: #d6a94b; color: #1b1405; font: inherit; font-weight: 600; cursor: pointer; min-width: 32px; min-height: 32px; }
      #char-panel button:disabled { opacity: 0.4; cursor: default; }
      .cp-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; } .cp-head span { flex: 1; color: #9db4e0; }
      .cp-realm { font-weight: 600; color: #ffd54a; } .cp-exp, .cp-points { margin: 4px 0; font-size: 13px; }
      .cp-bar { height: 8px; border-radius: 4px; background: #10141c; overflow: hidden; } .cp-fill { height: 100%; background: #6fcf97; }
      .cp-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; } .cp-name { flex: 1; } .cp-val { min-width: 32px; text-align: center; }
      .cp-changed { color: #6fcf97; font-weight: 600; } .cp-confirm { width: 100%; margin: 8px 0; padding: 8px 12px; }
      .cp-derived { border-top: 1px solid #3a4560; padding-top: 6px; font-size: 13px; color: #c9d1e3; }
      #chat { position: fixed; left: 12px; bottom: 12px; width: min(360px, calc(100vw - 24px)); font: 13px/1.4 "Be Vietnam Pro", system-ui, sans-serif; color: #e8e4d8; }
      #chat[hidden] { display: none; }
      #chat-log { max-height: 140px; overflow-y: auto; padding: 6px 8px; border-radius: 8px 8px 0 0; background: rgba(0, 0, 0, 0.45); word-break: break-word; }
      #chat-log:empty { display: none; }
      #chat-log b { color: #9db4e0; } #chat-log b.self { color: #ffd54a; } #chat-log .system { color: #ff8a80; font-style: italic; }
      #chat-form { display: flex; gap: 4px; }
      #chat-input { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid #3a4560; background: rgba(16, 20, 28, 0.85); color: inherit; font: inherit; }
      #chat-send { padding: 6px 10px; border-radius: 8px; border: 0; background: #d6a94b; color: #1b1405; font: inherit; font-weight: 600; cursor: pointer; }
      #hud {
        position: fixed; left: 12px; top: 12px; padding: 8px 12px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.55); color: #e8e4d8; font: 14px/1.4 "Be Vietnam Pro", system-ui, sans-serif;
        pointer-events: none; user-select: none; max-width: calc(100vw - 130px); box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="auth" hidden></div>
    <div id="hud">Đang tải…</div>
    <div id="vitals" hidden><span id="vitals-text"></span><div id="vitals-bar"><div id="vitals-fill"></div></div><div id="wallet-text"></div></div>
    <button id="logout" hidden></button>
    <div id="chat" hidden>
      <div id="chat-log"></div>
      <form id="chat-form"><input id="chat-input" type="text" autocomplete="off" /><button id="chat-send" type="submit"></button></form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
